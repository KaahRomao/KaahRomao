# Salve este arquivo no repositório KaahRomao em:
# .github/workflows/snake.yml
#
# Depois de salvar, vá em Actions no GitHub e rode o workflow "Gerar Snake"
# manualmente uma vez. A partir daí ele roda sozinho a cada 12 horas.

name: Gerar Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar SVG da snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KaahRomao
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#E2001A&color_dots=#0A0A0A,#3a0a10,#7a0d17,#E2001A,#00F0FF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
